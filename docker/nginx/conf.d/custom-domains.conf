# ============================================================
# Hotels' own domains (www.khachsan.vn) — every HTTPS name that is not
# digistay.vn or *.digistay.vn lands here (default_server).
#
# The certificate is picked by the name the browser asks for (SNI):
# docker/certbot/custom-domains.sh issues one per verified domain into
# /etc/letsencrypt/live/<domain>/ within a minute of verification
# (src/lib/public-site/custom-domains.ts). A name without a certificate
# fails the handshake, which is all a browser needs to know.
#
# The app decides which site a host shows (src/middleware.ts); a host no
# site verified gets Digistay's own pages, never another hotel's.
# Static file, not rendered by envsubst: nothing here names digistay.vn.
# ============================================================

# Only a plain lowercase hostname may name a certificate path (no "..", no "/").
map $ssl_server_name $digistay_site_cert {
    "~^(?!.*\.\.)[a-z0-9-]+(\.[a-z0-9-]+)+$"  $ssl_server_name;
    default                                   "none";
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/$digistay_site_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$digistay_site_cert/privkey.pem;
    # Loaded per handshake from the name; kept for a minute (nginx >= 1.27.4).
    ssl_certificate_cache max=1000 inactive=20s valid=1m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_SITES:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # The site headers: like digistay.vn's, but HSTS without includeSubDomains
    # (it would force HTTPS on the hotel's other subdomains, mail.khachsan.vn...).
    include /etc/nginx/conf.d/security-headers-site.inc;
    # These domains point at us DNS only, but a hotel may still put its own
    # Cloudflare proxy in front: then its guests keep their own IP too.
    include /etc/nginx/conf.d/cloudflare-real-ip.inc;

    client_max_body_size 12m;

    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers-site.inc;
        access_log off;
    }
}
