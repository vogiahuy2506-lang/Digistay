# ============================================================
# Plain HTTP server — only used for:
#   1) ACME http-01 challenges (/.well-known/acme-challenge/*)
#   2) 301 redirect everything else to HTTPS
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # *.digistay.vn: property sites (docs/RUNBOOK.md, "SSL tên miền con qua Cloudflare").
    # default_server: hotels' own domains too, so Let's Encrypt reaches their
    # challenge (docker/certbot/custom-domains.sh) and visitors get the 301 to HTTPS.
    server_name digistay.vn www.digistay.vn *.digistay.vn;
    server_tokens off;
    # The guest's IP in the access log when a request comes through Cloudflare.
    include /etc/nginx/conf.d/cloudflare-real-ip.inc;

    # Certbot webroot — MUST stay reachable on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health probe — handy for uptime monitors that don't follow redirects.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS (301, not 302, so it sticks).
    location / {
        return 301 https://$host$request_uri;
    }
}