# ============================================================
# Plain HTTP server — only used for:
#   1) ACME http-01 challenges (/.well-known/acme-challenge/*)
#   2) 301 redirect everything else to HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name digistay.vn www.digistay.vn;

    # Certbot webroot — MUST stay reachable on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health probe — handy for uptime monitors that don't follow redirects.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS (301, not 302, so it sticks).
    location / {
        return 301 https://$host$request_uri;
    }
}