name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "=== [$(date)] Deploy triggered by GitHub Action ==="
            echo "Path: ${{ secrets.VPS_DEPLOY_PATH }}"
            echo "Command: ${{ secrets.VPS_DEPLOY_CMD }}"
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            ${{ secrets.VPS_DEPLOY_CMD }} 2>&1
            echo "=== [$(date)] Deploy finished ==="
