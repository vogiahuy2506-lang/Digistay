name: Secret scan

# gitleaks on the commits a PR adds and on every push to main (people push
# to main directly, so PR-only scanning would miss those). Only new commits
# are scanned; older findings are listed in .gitleaksignore after rotation.
# Rules: .gitleaks.toml. Runs the gitleaks binary from its Docker image, so
# no gitleaks-action license is involved.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan new commits
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$TO"        # first push of a branch: scan its whole history
          else
            RANGE="$FROM..$TO"
          fi
          echo "Scanning $RANGE"
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git . --log-opts="$RANGE" --redact --no-banner --verbose
