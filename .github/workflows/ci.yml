name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------
  # 1. Unit tests (Vitest, Prisma mocked).
  # ------------------------------------------------------------
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ------------------------------------------------------------
  # 2. TypeScript strict check (no emit).
  # ------------------------------------------------------------
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ------------------------------------------------------------
  # 3. Migration checks + integration tests on a real Postgres.
  #    The test database is built from prisma/migrations, the same
  #    files production runs, so there is no separate test schema.
  # ------------------------------------------------------------
  integration:
    name: Migrations & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digistay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digistay_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digistay_shadow?schema=public
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # check-migrations diffs against the base ref.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Migrations are append-only, destructive SQL acknowledged
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/check-migrations.mjs "$BASE_REF"

      - name: schema.prisma matches prisma/migrations
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "CREATE DATABASE digistay_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Integration tests (applies migrations first)
        run: npm run test:int

  # ------------------------------------------------------------
  # 4. Build & push the Docker image to GHCR.
  #    Skipped on PRs from forks (no token permissions).
  # ------------------------------------------------------------
  build-image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, typecheck, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/digistay
          # Full 40-char SHA: docker/deploy.sh deploys exactly this tag.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to:   type=gha,scope=${{ github.workflow }},mode=max

  # ------------------------------------------------------------
  # 5. Optional lint (only if a `lint` script exists).
  # ------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint (skip if script absent)
        run: |
          if npm run | grep -qE '^  lint$'; then
            echo "Running lint script"
            npm run lint
          else
            echo "No lint script in package.json — skipping."
          fi